name: Update Stock Radar Data

on:
  workflow_dispatch:

  schedule:
    # Chạy mỗi 3 giờ, phút thứ 15.
    # Không chạy quá dày để hạn chế bị VNStock giới hạn request.
    - cron: "15 */3 * * *"

permissions:
  contents: write

concurrency:
  group: stock-radar-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    # Guest quét vài trăm mã có thể mất khoảng 25–35 phút.
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        env:
          # Secret này được truyền vào nếu bạn đã tạo trên GitHub.
          # Nếu chưa dùng được key, scanner vẫn chạy chế độ Guest,
          # nhưng sẽ tự giới hạn tốc độ dưới 20 request/phút.
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python scripts/scan.py

      - name: Commit updated data
        run: |
          git config user.name "stock-radar-bot"
          git config user.email "stock-radar-bot@users.noreply.github.com"

          git add data.json
          git diff --staged --quiet || git commit -m "Update stock radar data"
          git push
